<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>X Space 多窗口静音控制器</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #161d26;
      --card-focused: #1c2736;
      --border: #2a3746;
      --border-focused: #7856ff;
      --text: #e7e9ea;
      --muted: #8b98a5;
      --purple: #7856ff;
      --blue: #1d9bf0;
      --green: #00ba7c;
      --red: #f4212e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 440px;
      max-height: 600px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
    }
    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 8px var(--purple);
    }
    .summary-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(120, 86, 255, 0.16);
      color: #b49ffc;
      border: 1px solid rgba(120, 86, 255, 0.35);
      font-weight: 600;
    }
    .global-bar {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.14s ease;
    }
    .btn:hover {
      border-color: var(--blue);
      background: rgba(29, 155, 240, 0.12);
    }
    .btn-danger:hover {
      border-color: var(--red);
      background: rgba(244, 33, 46, 0.14);
      color: #ff6b74;
    }
    .btn-solo {
      background: rgba(120, 86, 255, 0.18);
      border-color: rgba(120, 86, 255, 0.5);
      color: #d2c4ff;
    }
    .btn-solo:hover {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }
    .prefs-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      font-size: 12px;
    }
    .prefs-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .windows-container {
      overflow-y: auto;
      max-height: 410px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }
    .window-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .window-card.focused-win {
      background: var(--card-focused);
      border-color: rgba(120, 86, 255, 0.55);
    }
    .win-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .win-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .win-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(29, 155, 240, 0.18);
      color: var(--blue);
    }
    .audible-pill {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(0, 186, 124, 0.18);
      color: var(--green);
    }
    .muted-pill {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(244, 33, 46, 0.18);
      color: #ff6b74;
    }
    .win-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .mini-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .mini-btn:hover {
      border-color: var(--blue);
    }
    .mini-btn.muted-state {
      background: rgba(244, 33, 46, 0.18);
      border-color: rgba(244, 33, 46, 0.45);
      color: #ff858d;
    }
    .mini-btn.unmuted-state {
      background: rgba(0, 186, 124, 0.16);
      border-color: rgba(0, 186, 124, 0.45);
      color: #2ce09b;
    }
    .tab-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 9px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .tab-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .tab-info-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tab-title-line {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tab-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-name:hover {
      color: var(--blue);
      text-decoration: underline;
    }
    .edit-label-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      padding: 1px 3px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .edit-label-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .tab-sub {
      font-size: 11.5px;
      color: #b49ffc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vol-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .vol-slider {
      flex: 1;
      accent-color: var(--purple);
      height: 4px;
      cursor: pointer;
    }
    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border-radius: 10px;
      border: 1px dashed var(--border);
      line-height: 1.6;
    }
    .shortcut-hint {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
    kbd {
      background: #1d2733;
      border: 1px solid #334458;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      color: #c6d2de;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="pulse-dot"></span>
      <span>🎙️ X Space 多窗口混音台</span>
    </div>
    <span class="summary-pill" id="summaryPill">扫描中...</span>
  </div>

  <div class="global-bar">
    <button type="button" class="btn btn-solo" id="soloCurrentWinBtn">
      🎧 独奏当前窗口
    </button>
    <button type="button" class="btn btn-danger" id="muteAllBtn">
      🔇 全部静音
    </button>
    <button type="button" class="btn" id="unmuteAllBtn">
      🔊 全部恢复
    </button>
  </div>

  <div class="prefs-bar">
    <label>
      <input type="checkbox" id="autoSoloFocusedWindow" />
      <span>⚡ 切换窗口时自动独奏焦点窗口 (Auto-Solo)</span>
    </label>
  </div>

  <div class="windows-container" id="windowsContainer"></div>

  <div class="shortcut-hint">
    快捷键: <kbd>Alt+Shift+S</kbd> 独奏当前窗口 · <kbd>Alt+Shift+M</kbd> 静音当前窗口 · <kbd>Alt+Shift+X</kbd> 全部静音
  </div>

  <script src="popup.js"></script>
</body>
</html>
